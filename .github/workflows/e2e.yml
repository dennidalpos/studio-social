name: E2E tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty value: use the Chromium that Playwright installs below.
      E2E_CHANNEL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install FFmpeg (media upload test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
