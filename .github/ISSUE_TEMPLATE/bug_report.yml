name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Demo mode, Live mode, Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove keys, tokens and personal data first.
